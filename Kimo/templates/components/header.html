<header
  class="sticky top-0 z-30 bg-white/70 backdrop-blur rounded-b-2xl  border-b border-gray-200"
>
  <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
    <!-- Left: Page Info -->
    <div class="flex items-center gap-3 min-w-0">
      <h1 class="text-2xl font-medium text-gray-900 truncate">
        {{ page_title }}
      </h1>

      {% if page_subtitle %}
      <span class="hidden sm:inline text-lg text-gray-400 truncate">
        {{ page_subtitle }}
      </span>
      {% endif %}
    </div>


  </div>
</header>
